name: Publish consolidated arcade
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified app and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          cat publication/part-* > /tmp/arcade.bundle
          echo "9342d7e589238f1c222bd426c3a00ddb39a95c741c646239f21f51364368491a  /tmp/arcade.bundle" | sha256sum -c -
          git fetch https://github.com/tcballard/omarchy-chess.git 1a12a8fa6e6e31578ca603d2f28dbbf3b9ccc8fe
          git fetch https://github.com/tcballard/omarchy-solitaire.git 719865898e71e3b4cfad3a23da4709e735edd5b3
          git fetch https://github.com/tcballard/omarchy-scram.git c7819a95061734b78b77091efb04251231767d4d
          git fetch https://github.com/tcballard/omarchy-invaders.git 6e79fd5b528c98c8710c36d875d1f14d40daa171
          git fetch https://github.com/tcballard/omarchy-spacecadet.git ff47f9c70107fe0cc8eb750f7d3e8917929426d3
          git bundle verify /tmp/arcade.bundle
          git fetch /tmp/arcade.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = b1dec039416e539c13901851c01727f93bb553ec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree b1dec039416e539c13901851c01727f93bb553ec
          git reset HEAD -- .github/workflows/publish.yml
          published=$(git commit-tree "$(git write-tree)" -p HEAD -p b1dec039416e539c13901851c01727f93bb553ec -m "Publish consolidated arcade with full game histories")
          git push origin "$published:refs/heads/main"
