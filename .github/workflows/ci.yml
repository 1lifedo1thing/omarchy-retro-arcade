name: Verify chess preview
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      OMARCHY_CHESS_ENGINE: /usr/games/stockfish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine and native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish libegl1 libopengl0 libxkbcommon0 desktop-file-utils
      - name: Install application and test tools
        run: python -m pip install . pytest ruff build
      - name: Lint and test with real Stockfish
        run: |
          ruff check omarchy_chess tests
          ruff format --check omarchy_chess tests
          desktop-file-validate packaging/omarchy-chess.desktop
          python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Render native window
        run: python -m omarchy_chess --screenshot preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: python-preview-${{ matrix.python-version }}
          path: |
            dist/*
            preview.png
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm git python python-build python-installer python-setuptools python-wheel python-pytest pyside6 qt6-svg qt6-wayland sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Build and install rules dependency
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd packaging/python-chess
          sudo -u builder makepkg --cleanbuild --clean
          pacman -U --noconfirm ./*.pkg.tar.zst
      - name: Build native application package
        run: sudo -u builder ./packaging/build-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch-preview
          path: |
            dist/arch/*.pkg.tar.zst
            packaging/python-chess/*.pkg.tar.zst
