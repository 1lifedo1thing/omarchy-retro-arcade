[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-chess"
version = "0.1.0.dev1"
description = "A quiet, native chess board for Omarchy, powered by Stockfish"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
readme = "README.md"
dependencies = ["chess>=1.11.2,<2", "PySide6>=6.6,<7"]

[project.scripts]
omarchy-chess = "omarchy_chess.app:main"

[tool.setuptools.packages.find]
include = ["omarchy_chess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_ui.py" = ["E402"]
