[package]
name = "omarchy-invaders"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
toml = "0.8"

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
strip = true
