[package]
name = "omarchy-chess"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"
description = "Native offline chess for Omarchy, powered by Stockfish"
repository = "https://github.com/tcballard/omarchy-chess"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "0.31.1", default-features = false, features = ["svg"] }
shakmaty = "0.27.3"
pgn-reader = "0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
tempfile = "3"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

rustix = { version = "1", features = ["fs"] }

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
lto = false
strip = true
