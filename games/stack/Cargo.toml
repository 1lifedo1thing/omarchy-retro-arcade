[package]
name = "omarchy-stack"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["ui"]
ui = ["dep:eframe", "dep:omarchy-chess", "dep:tempfile", "dep:arcade-leaderboard", "dep:chrono"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"], optional = true }
omarchy-chess = { path = "../chess", optional = true }
tempfile = { version = "3", optional = true }

arcade-leaderboard = { path = "../../shared/leaderboard", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
