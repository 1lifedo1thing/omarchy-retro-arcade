[package]
name = "omarchy-snake"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["ui"]
ui = ["dep:arcade-presentation", "dep:eframe", "dep:arcade-platform", "dep:tempfile"]

[dependencies]
arcade-presentation = { path = "../../shared/presentation", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"], optional = true }
arcade-platform = { path = "../../shared/platform", features = ["theme"], optional = true }
tempfile = { version = "3", optional = true }
