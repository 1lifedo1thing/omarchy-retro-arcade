[package]
name = "omarchy-tanks"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = []
desktop = ["dep:eframe", "dep:arcade-platform", "dep:arcade-presentation"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"], optional = true }
arcade-platform = { path = "../../shared/platform", features = ["theme"], optional = true }
arcade-presentation = { path = "../../shared/presentation", optional = true }
